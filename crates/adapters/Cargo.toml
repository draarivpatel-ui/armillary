[package]
name = "orrery-adapters"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
armillary-model = { path = "../model" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=0.8.23"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
glob = "=0.3.2"
regex = "=1.11.1"
chrono = { version = "=0.4.40", default-features = false, features = ["std", "clock"] }
sha2 = "=0.10.8"
thiserror = "=2.0.12"
walkdir = "=2.5.0"

tempfile = "=3.19.1"
libc = "=0.2.190"

[dev-dependencies]
