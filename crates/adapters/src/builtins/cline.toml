# Cline adapter specification
# Sources:
# - Official repository: https://github.com/cline/cline
# - Storage paths and environment overrides: https://github.com/cline/cline/blob/main/sdk/packages/shared/src/storage/paths.ts
# - Extension storage layout: https://github.com/cline/cline/blob/main/apps/vscode/src/core/storage/disk.ts
# - CLI documentation and flags: https://docs.cline.bot/cli/cli-reference
# - Extension ID: saoudrizwan.claude-dev (apps/vscode/package.json)

id = "cline"
name = "Cline"
vendor = "Cline Bot Inc."
family = "open-source CLIs"
kind = "extension"
adapter_version = "1.0.0"
homepage = "https://cline.bot"
docs_url = "https://docs.cline.bot"
coverage = "history"

[detection]
binaries = ["cline"]
app_bundles = ["Cline"]
version_args = ["--version"]

[detection.paths.macos]
data_folders = [
    "~/.cline/data",
    "~/Library/Application Support/Code/User/globalStorage/saoudrizwan.claude-dev",
    "~/Library/Application Support/Cursor/User/globalStorage/saoudrizwan.claude-dev",
    "~/Library/Application Support/Windsurf/User/globalStorage/saoudrizwan.claude-dev",
    "~/Library/Application Support/VSCodium/User/globalStorage/saoudrizwan.claude-dev"
]
config_files = [
    "~/.cline/data/settings/global-settings.json",
    "~/.cline/data/settings/cline_mcp_settings.json"
]

[detection.paths.linux]
data_folders = [
    "~/.cline/data",
    "~/.config/Code/User/globalStorage/saoudrizwan.claude-dev",
    "~/.config/Cursor/User/globalStorage/saoudrizwan.claude-dev",
    "~/.config/Windsurf/User/globalStorage/saoudrizwan.claude-dev",
    "~/.config/VSCodium/User/globalStorage/saoudrizwan.claude-dev"
]
config_files = [
    "~/.cline/data/settings/global-settings.json",
    "~/.cline/data/settings/cline_mcp_settings.json"
]

[detection.paths.windows]
data_folders = [
    "%USERPROFILE%\\.cline\\data",
    "%APPDATA%\\Code\\User\\globalStorage\\saoudrizwan.claude-dev",
    "%APPDATA%\\Cursor\\User\\globalStorage\\saoudrizwan.claude-dev",
    "%APPDATA%\\Windsurf\\User\\globalStorage\\saoudrizwan.claude-dev",
    "%APPDATA%\\VSCodium\\User\\globalStorage\\saoudrizwan.claude-dev"
]
config_files = [
    "%USERPROFILE%\\.cline\\data\\settings\\global-settings.json",
    "%USERPROFILE%\\.cline\\data\\settings\\cline_mcp_settings.json"
]

[[history_sources]]
id = "cline-history"
format = "json"
module = "cline"

[history_sources.paths]
macos = [
    "~/.cline/data/sessions/*",
    "~/Library/Application Support/Code/User/globalStorage/saoudrizwan.claude-dev/tasks/*",
    "~/Library/Application Support/Cursor/User/globalStorage/saoudrizwan.claude-dev/tasks/*",
    "~/Library/Application Support/Windsurf/User/globalStorage/saoudrizwan.claude-dev/tasks/*"
]
linux = [
    "~/.cline/data/sessions/*",
    "~/.config/Code/User/globalStorage/saoudrizwan.claude-dev/tasks/*",
    "~/.config/Cursor/User/globalStorage/saoudrizwan.claude-dev/tasks/*",
    "~/.config/Windsurf/User/globalStorage/saoudrizwan.claude-dev/tasks/*"
]
windows = [
    "%USERPROFILE%\\.cline\\data\\sessions\\*",
    "%APPDATA%\\Code\\User\\globalStorage\\saoudrizwan.claude-dev\\tasks\\*",
    "%APPDATA%\\Cursor\\User\\globalStorage\\saoudrizwan.claude-dev\\tasks\\*",
    "%APPDATA%\\Windsurf\\User\\globalStorage\\saoudrizwan.claude-dev\\tasks\\*"
]
