# Plandex adapter specification. Coverage: detect only.
#
# Primary sources:
#   - https://github.com/plandex-ai/plandex
#   - Docs: https://docs.plandex.ai
#
# Secret files under the data folder that this adapter never opens:
# auth.json, accounts.json, creds.json.

id = "plandex"
name = "Plandex"
vendor = "Plandex AI"
family = "open-source CLIs"
kind = "cli"
coverage = "detect"
homepage = "https://plandex.ai"
docs_url = "https://docs.plandex.ai"

[detection]
binaries = ["plandex", "pdx"]
generic_binaries = ["pdx"]
app_bundles = []
version_args = ["--version"]

[detection.paths.macos]
data_folders = [
    "~/.plandex-home-v2"
]
config_files = []

[detection.paths.linux]
data_folders = [
    "~/.plandex-home-v2"
]
config_files = []

[detection.paths.windows]
data_folders = [
    "%USERPROFILE%\\.plandex-home-v2"
]
config_files = []
